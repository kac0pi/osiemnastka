<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Trik z wersją ?v=3, aby Opera na pewno pobrała nowy, dojebany wygląd ze style.css -->
    <link rel="stylesheet" href="style.css?v=3" />
    <title>Odliczanie do Osiemnastki</title>
  </head>
  <body>
    <!-- Nagłówek na samej górze strony -->
    <header>
      <h1>Odliczanie do mojej osiemnastki</h1>
    </header>

    <!-- Główny kontener na rozciągnięty licznik -->
    <div class="main-content">
      <div class="countdown-container">
        <h2>Do 18 urodzin pozostało:</h2>
        <div class="countdown-grid">
          <div class="countdown-box">
            <span id="days">--</span>
            <p>Dni</p>
          </div>
          <div class="countdown-box">
            <span id="hours">--</span>
            <p>Godzin</p>
          </div>
          <div class="countdown-box">
            <span id="minutes">--</span>
            <p>Minut</p>
          </div>
          <div class="countdown-box">
            <span id="seconds">--</span>
            <p>Sekund</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Muzyka (Własny odtwarzacz w stylu strony) -->
    <div class="custom-audio-player">
      <audio id="my-audio" loop>
        <source src="muzyka.mp3" type="audio/mpeg">
        Twoja przeglądarka nie obsługuje znacznika audio.
      </audio>
      
      <div class="player-controls">
        <!-- Przycisk Play/Pause -->
        <button id="play-btn" class="player-btn" aria-label="Odtwarzaj">▶</button>
        
        <!-- Przewijanie utworu -->
        <div class="timeline-container">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-slider" min="0" max="100" value="0">
          <span id="duration">0:00</span>
        </div>
        
        <!-- Regulacja głośności -->
        <div class="volume-container">
          <button id="mute-btn" class="player-btn" aria-label="Wycisz">🔊</button>
          <input type="range" id="volume-slider" min="0" max="100" value="80">
        </div>
      </div>
    </div>

    <!-- Stopka na samym dole -->
    <footer>
        <p>&copy; Moja Osiemnastka <span id="year"></span> Wszelkie prawa zastrzeżone.</p>
    </footer>

    <!-- Skrypty wykonawcze -->
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // --- LOGIKA WŁASNEGO LICZNIKA ---
      const targetDate = new Date("January 22, 2027 18:00:00").getTime();

      function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference < 0) {
          document.querySelector(".countdown-container").innerHTML = "<h2>🎉 Już trwa! Wszystkiego najlepszego! 🎉</h2>";
          return;
        }

        const d = Math.floor(difference / (1000 * 60 * 60 * 24));
        const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = d;
        document.getElementById("hours").textContent = h < 10 ? "0" + h : h;
        document.getElementById("minutes").textContent = m < 10 ? "0" + m : m;
        document.getElementById("seconds").textContent = s < 10 ? "0" + s : s;
      }

      setInterval(updateCountdown, 1000);
      updateCountdown();


      // --- LOGIKA ODTWARZACZA MUZYKI + INTELIGENTNE AUTOPLAY ---
      const audio = document.getElementById('my-audio');
      const playBtn = document.getElementById('play-btn');
      const muteBtn = document.getElementById('mute-btn');
      const seekSlider = document.getElementById('seek-slider');
      const volumeSlider = document.getElementById('volume-slider');
      const currentTimeLabel = document.getElementById('current-time');
      const durationLabel = document.getElementById('duration');

      function formatTime(secs) {
        const minutes = Math.floor(secs / 60);
        const seconds = Math.floor(secs % 60);
        return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
      }

      // FUNKCJA: Próba odtworzenia muzyki przy pierwszym kliknięciu na stronę
      function sprawdzAutoplay() {
        if (audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = '⏸';
            // Usuwamy nasłuchiwanie po pierwszym udanym starcie, by nie przerywać muzyki przy kolejnych kliknięciach
            document.removeEventListener('click', sprawdzAutoplay);
            document.removeEventListener('touchstart', sprawdzAutoplay);
          }).catch(err => {
            console.log("Przeglądarka nadal blokuje dźwięk, wymagane kliknięcie bezpośrednio w przycisk Play.");
          });
        }
      }

      // Nasłuchiwanie na jakiekolwiek kliknięcie w ekran, aby odpalić muzykę
      document.addEventListener('click', sprawdzAutoplay);
      document.addEventListener('touchstart', sprawdzAutoplay); // Obsługa ekranów dotykowych

      // Ręczna obsługa przycisku Play / Pause
      playBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Blokuje aktywację innych funkcji kliknięcia
        if (audio.paused) {
          audio.play();
          playBtn.textContent = '⏸';
        } else {
          audio.pause();
          playBtn.textContent = '▶';
        }
      });

      audio.addEventListener('timeupdate', () => {
        if (!isNaN(audio.duration)) {
          const progress = (audio.currentTime / audio.duration) * 100;
          seekSlider.value = progress;
          currentTimeLabel.textContent = formatTime(audio.currentTime);
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        durationLabel.textContent = formatTime(audio.duration);
      });

      seekSlider.addEventListener('input', () => {
        const seekTo = audio.duration * (seekSlider.value / 100);
        audio.currentTime = seekTo;
      });

      volumeSlider.addEventListener('input', () => {
        audio.volume = volumeSlider.value / 100;
        if (audio.volume === 0) {
          muteBtn.textContent = '🔇';
        } else if (audio.volume < 0.5) {
          muteBtn.textContent = '🔉';
        } else {
          muteBtn.textContent = '🔊';
        }
        audio.muted = false;
      });

      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        audio.muted = !audio.muted;
        if (audio.muted) {
          muteBtn.textContent = '🔇';
          volumeSlider.value = 0;
        } else {
          muteBtn.textContent = audio.volume < 0.5 ? '🔉' : '🔊';
          volumeSlider.value = audio.volume * 100;
        }
      });
    </script>
  </body>
</html>
